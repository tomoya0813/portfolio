<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tetris.css">
    <title>テトリス</title>
</head>

<body>
    <h1 class="none">tetris</h1>
    <div class="container">

        <div class="game-wrapper">

            <div class="hold-wrapper">
                <p class="text">Hold</p>
                <canvas id="hold" width="160" height="160"></canvas>
            </div>

            <canvas id="field" width="400" height="800"></canvas>

            <div class="next-wrapper">
                <p class="text">Next</p>
                <canvas class="next" width="160" height="160"></canvas>
                <canvas class="next" width="160" height="160"></canvas>
                <canvas class="next" width="160" height="160"></canvas>
                <canvas class="next" width="160" height="160"></canvas>
            </div>
            <div class="control">
                <h2>操作方法</h2>
                <dl>
                    <dt>A / D</dt>
                    <dd>左右移動</dd>

                    <dt>S</dt>
                    <dd>ソフトドロップ</dd>

                    <dt>W</dt>
                    <dd>ハードドロップ</dd>

                    <dt>J / K</dt>
                    <dd>左回転 / 右回転</dd>

                    <dt>Space</dt>
                    <dd>ホールド</dd>

                    <dt>P</dt>
                    <dd>ポーズ</dd>

                    <dt>Esc</dt>
                    <dd>スタート画面</dd>
                </dl>
            </div>
            <dl class="game-status">

                <dt>score</dt>
                <dd id="score">0</dd>

                <dt>line</dt>
                <dd id="line">0</dd>

                <dt>level</dt>
                <dd id="level">1</dd>
            </dl>

            <div id="message" class="">
                <p id="text1" class="text">TETRIS</p>
                <p id="text2" class="text">Press Enter</p>
                <p id="text3" class="text">Start</p>
            </div>

        </div>

    </div>
</body>
<script src="tetris.js"></script>

</html>
