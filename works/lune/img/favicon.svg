<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 三日月（1つの図形に結合して背景を透過） -->
  <mask id="moon-cut">
    <circle cx="50" cy="50" r="45" fill="white" />
    <circle cx="82" cy="28" r="50" fill="black" />
  </mask>
  <circle cx="50" cy="50" r="45" fill="#025394" mask="url(#moon-cut)" />
</svg>
